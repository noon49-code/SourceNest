name: SourceNest portable checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q engine install.py setup.py build_release.py
      - run: python build_release.py --output dist
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: SourceNest-release-candidate
          path: dist/*
