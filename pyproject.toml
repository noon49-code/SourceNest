[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourcenest"
version = "2.0.1"
description = "Portable project memory for AI coding assistants (Codex, Claude Code, Cursor)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "noon49-code" },
]
keywords = [
    "ai",
    "coding-assistant",
    "memory",
    "codex",
    "claude",
    "cursor",
    "project-context",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/noon49-code/SourceNest"
Repository = "https://github.com/noon49-code/SourceNest"
Changelog = "https://github.com/noon49-code/SourceNest/blob/main/CHANGELOG.md"
Documentation = "https://github.com/noon49-code/SourceNest/blob/main/docs/v2-guide.md"

[project.scripts]
sourcenest = "engine:main"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.hatch.build.targets.sdist]
include = [
    "engine/",
    "beyin.py",
    "install.py",
    "build_release.py",
    "tests/",
    "docs/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CREDITS.md",
    "PRIVACY.md",
    "RULES.md",
    "VALIDATION.md",
    "config.example.json",
    "projects.example.json",
    "pyproject.toml",
]
