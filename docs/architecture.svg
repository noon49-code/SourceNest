<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
  <title id="title">SourceNest: a private vault for your projects</title>
  <desc id="desc">Hooks capture registered Codex sessions into local JSON. A configured model proposes summaries. Local validation precedes project records and Markdown pages in a private vault outside code repositories.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker></defs>
  <rect width="720" height="690" rx="20" fill="#0f172a"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="32" y="46" font-size="27" font-weight="700">One vault. Separate project memory.</text>
    <text x="32" y="76" font-size="18" fill="#cbd5e1">Stored outside your code repositories.</text>
    <rect x="32" y="106" width="656" height="88" rx="12" fill="#1e3a8a"/>
    <text x="52" y="140" font-size="22" font-weight="600">1. Capture registered Codex sessions</text>
    <text x="52" y="170" font-size="18">Hooks save new user and assistant text as local JSON.</text>
    <path d="M360 199V220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="232" width="656" height="88" rx="12" fill="#78350f"/>
    <text x="52" y="266" font-size="22" font-weight="600">2. Send text to the configured model</text>
    <text x="52" y="296" font-size="18">The provider returns proposed summaries and quotes.</text>
    <path d="M360 325V346" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="358" width="656" height="88" rx="12" fill="#14532d"/>
    <text x="52" y="392" font-size="22" font-weight="600">3. Check evidence locally</text>
    <text x="52" y="422" font-size="18">Validate message IDs, quotes and the JSON structure.</text>
    <path d="M360 451V472" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="484" width="656" height="126" rx="12" fill="#1e293b" stroke="#64748b"/>
    <text x="52" y="518" font-size="22" font-weight="600">4. Build each project's memory</text>
    <text x="52" y="550" font-size="18">JSON records → Markdown wiki, status and daily logs</text>
    <text x="52" y="581" font-size="18" fill="#cbd5e1">Project A / Project B / … → separate vault folders</text>
    <text x="32" y="650" font-size="17" fill="#cbd5e1">Evidence checks establish traceability, not factual correctness.</text>
  </g>
</svg>
