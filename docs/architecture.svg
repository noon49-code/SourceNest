<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">SourceNest data flow</title>
  <desc id="desc">A Codex session enters lifecycle hooks, becomes an immutable source record, passes through a configured summarizer and local validation, then becomes project records and a Markdown wiki.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <text x="56" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">SourceNest keeps the receipt with the note</text>
  <text x="56" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#cbd5e1">Visible conversation → source record → checked memory → project wiki</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(48 132)"><rect width="170" height="100" rx="16" fill="#1e3a8a"/><text x="20" y="37" font-size="17" font-weight="700" fill="#fff">Codex session</text><text x="20" y="64" font-size="13" fill="#dbeafe">user + assistant text</text></g>
    <g transform="translate(272 132)"><rect width="170" height="100" rx="16" fill="#075985"/><text x="20" y="37" font-size="17" font-weight="700" fill="#fff">Lifecycle hooks</text><text x="20" y="64" font-size="13" fill="#cffafe">capture by project path</text></g>
    <g transform="translate(496 132)"><rect width="170" height="100" rx="16" fill="#155e75"/><text x="20" y="37" font-size="17" font-weight="700" fill="#fff">Source record</text><text x="20" y="64" font-size="13" fill="#cffafe">immutable JSON + quote</text></g>
    <g transform="translate(720 132)"><rect width="170" height="100" rx="16" fill="#166534"/><text x="20" y="37" font-size="17" font-weight="700" fill="#fff">Validation</text><text x="20" y="64" font-size="13" fill="#dcfce7">IDs, schema, evidence</text></g>
    <g transform="translate(944 132)"><rect width="208" height="100" rx="16" fill="#713f12"/><text x="20" y="37" font-size="17" font-weight="700" fill="#fff">Project wiki</text><text x="20" y="64" font-size="13" fill="#fef3c7">Markdown + daily history</text></g>
  </g>
  <g stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M218 182 H266"/><path d="M442 182 H490"/><path d="M666 182 H714"/><path d="M890 182 H938"/></g>
  <text x="56" y="286" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1">The model proposes structured data; local code decides what can be written.</text>
</svg>
